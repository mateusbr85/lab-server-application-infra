services:
  it-tools:
    image: corentinth/it-tools:latest
    container_name: it-tools
    restart: unless-stopped
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.it-tools.rule=Host(`it-tools.lab-server`)"
      # Opcional: Se o Traefik não detectar a porta automaticamente, descomente a linha abaixo:
      # - "traefik.http.services.it-tools.loadbalancer.server.port=80"

networks:
  web:
    external: true
