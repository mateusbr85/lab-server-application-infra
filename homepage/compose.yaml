services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.lab-server
    networks:
      - web
    volumes:
      # Ficheiros de configuração onde irá adicionar os seus links (Draw.io, Dockge, etc.)
      - ./config:/app/config
      # (Opcional mas recomendado) Permite ao Homepage ler o status do Docker para mostrar se os serviços estão online
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.homepage.rule=Host(`homepage.lab-server`)
      # A porta interna padrão do Homepage é a 3000
      - traefik.http.services.homepage.loadbalancer.server.port=3000
networks:
  web:
    external: true
